<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clínica Sēntia — Painel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#241511;
  --ink-2:#5B2A1B;
  --paper:#F6EEE6;
  --card:#FFFCF9;
  --terracotta:#C1603C;
  --terracotta-deep:#8B3E24;
  --terracotta-light:#F1DBCB;
  --sage:#5C7A63;
  --sage-light:#E1E8DF;
  --ochre:#B4872F;
  --ochre-light:#F0E3C7;
  --rust:#A6432B;
  --rust-light:#F0DAD3;
  --text:#2C1D17;
  --text-soft:#7A6459;
  --line:rgba(44,29,23,0.15);
  --line-soft:rgba(44,29,23,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 100% 0%, rgba(193,96,60,0.10), transparent 45%),
    radial-gradient(circle at 0% 100%, rgba(139,62,36,0.07), transparent 40%),
    var(--paper);
  color:var(--text);
  font-family:'Montserrat',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  letter-spacing:-0.01em;
}
.section-head h1{
  background:linear-gradient(100deg, var(--text) 30%, var(--terracotta-deep) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- SHELL ---------- */
#app{
  display:flex;
  min-height:100vh;
}
#sidebar{
  width:232px;
  flex-shrink:0;
  background:linear-gradient(155deg, var(--ink) 0%, var(--ink-2) 62%, var(--terracotta) 140%);
  color:#F3E8DF;
  padding:28px 18px;
  display:flex;
  flex-direction:column;
  gap:6px;
  position:sticky;
  top:0;
  height:100vh;
}
#sidebar .brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-family:'Montserrat',sans-serif;
  font-size:19px;
  font-weight:700;
  color:#fff;
  margin-bottom:2px;
  padding:0 10px;
}
#sidebar .brand .brand-mark{flex-shrink:0;}
#sidebar .brand .brand-text{display:flex; flex-direction:column; line-height:1.15;}
#sidebar .brand small{
  display:block;
  font-family:'Montserrat',sans-serif;
  font-weight:400;
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#D9B7A3;
  margin-top:4px;
}
.nav-divider{height:1px;background:rgba(255,255,255,.12);margin:16px 10px;}
.nav-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 12px;
  border-radius:9px;
  cursor:pointer;
  font-family:'Montserrat',sans-serif;
  font-size:14.5px;
  font-weight:500;
  color:#E4CFC1;
  transition:background .15s, color .15s;
  user-select:none;
}
.nav-item svg{flex-shrink:0; opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.08); color:#fff;}
.nav-item.active{background:linear-gradient(120deg,#FBF3EC,#F1DBCB); color:var(--terracotta-deep);}
.nav-item.active svg{opacity:1;}
#sidebar .foot{
  margin-top:auto;
  padding:10px;
  font-size:11px;
  color:#C79A85;
  line-height:1.5;
}

#main{
  flex:1;
  padding:38px 46px 70px;
  max-width:1180px;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:28px;
  gap:20px;
  flex-wrap:wrap;
}
.section-head h1{font-size:30px; margin:0 0 6px;}
.section-head p{margin:0; color:var(--text-soft); font-size:14px; max-width:520px;}
.eyebrow{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--terracotta-deep);
  font-weight:600;
  margin-bottom:6px;
}

.btn{
  border:none;
  cursor:pointer;
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  font-size:13px;
  padding:10px 16px;
  border-radius:8px;
  background:linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-deep) 100%);
  color:#fff;
  transition:transform .1s, filter .15s;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.97);}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--line);}
.btn.ghost:hover{background:var(--card); border-color:var(--terracotta);}
.btn.danger{background:transparent; color:var(--rust); border:1px solid var(--rust-light);}
.btn.danger:hover{background:var(--rust-light);}
.btn.sm{padding:6px 11px; font-size:12px; border-radius:6px;}
.btn.icon{padding:7px 9px; line-height:0;}

input,select,textarea{
  font-family:'Montserrat',sans-serif;
  font-size:13.5px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:7px;
  padding:9px 11px;
  color:var(--text);
  outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--terracotta); box-shadow:0 0 0 3px var(--terracotta-light);}
label.field-label{font-size:11.5px; font-weight:600; color:var(--text-soft); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:5px;}

/* ---------- PAGAMENTOS: drawer grid ---------- */
.year-switch{display:flex; align-items:center; gap:12px; font-family:'Montserrat',sans-serif; font-size:19px;}
.year-switch button{background:none;border:none;cursor:pointer;color:var(--text-soft);font-size:17px;padding:2px 6px;border-radius:6px;}
.year-switch button:hover{background:var(--terracotta-light); color:var(--terracotta-deep);}

.drawer-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:34px 30px;
  margin:36px 6px 46px 0;
  perspective:1400px;
}
.drawer{
  position:relative;
  background:var(--card);
  border-radius:4px 10px 10px 4px;
  border:1px solid var(--line);
  padding:18px 16px 16px;
  cursor:pointer;
  transform:rotateZ(0deg) translate(0,0);
  box-shadow:
    5px 5px 0 -1px var(--paper), 5px 5px 0 0 var(--line-soft),
    10px 10px 0 -1px var(--paper), 10px 10px 0 0 var(--line-soft);
  transition:transform .22s ease, box-shadow .22s ease;
  min-height:118px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.drawer:before{
  content:'';
  position:absolute;
  left:0; top:14px; bottom:14px;
  width:4px;
  border-radius:2px;
  background:var(--empty-c, #C7CFC7);
}
.drawer.status-empty:before{background:#C7CFC7;}
.drawer.status-pending:before{background:var(--ochre);}
.drawer.status-paid:before{background:var(--sage);}
.drawer:hover{
  transform:translate(-3px,-5px);
  box-shadow:
    8px 8px 0 -1px var(--paper), 8px 8px 0 0 var(--line-soft),
    16px 16px 0 -1px var(--paper), 16px 16px 0 0 var(--line-soft),
    0 18px 30px -12px rgba(139,62,36,.35);
}
.drawer .m-name{font-family:'Montserrat',sans-serif; font-size:17px; font-weight:600; margin-left:10px;}
.drawer .m-total{font-family:'IBM Plex Mono',monospace; font-size:19px; margin-left:10px; margin-top:10px;}
.drawer .m-sub{font-size:11px; color:var(--text-soft); margin-left:10px; margin-top:3px;}
.drawer .m-tag{
  align-self:flex-start;
  margin-left:10px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.05em;
  font-weight:600;
  padding:3px 7px;
  border-radius:20px;
  margin-top:8px;
}
.drawer.status-empty .m-tag{background:#EDEFEA;color:#8B968E;}
.drawer.status-pending .m-tag{background:var(--ochre-light);color:#8A5A22;}
.drawer.status-paid .m-tag{background:var(--sage-light);color:var(--sage);}

/* dashboard */
.dash-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:34px;}
.dash-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
.dash-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-soft); font-weight:600;}
.dash-card .value{font-family:'IBM Plex Mono',monospace; font-size:23px; margin-top:8px;}
.dash-card.paid .value{color:var(--sage);}
.dash-card.pending .value{color:var(--ochre);}

.bars{display:flex; align-items:flex-end; gap:8px; height:120px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 14px 8px; margin-bottom:16px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.bar-col .bar{width:100%; max-width:20px; border-radius:3px 3px 0 0; background:linear-gradient(180deg, var(--terracotta) 0%, var(--terracotta-deep) 100%); min-height:2px;}
.bar-col .lbl{font-size:9.5px; color:var(--text-soft);}

.people-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
.person-pill{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:8px 14px; font-size:13px; display:flex; gap:8px; align-items:center;}
.person-pill .amt{font-family:'IBM Plex Mono',monospace; font-weight:600;}

/* ---------- MODAL ---------- */
#overlay{
  position:fixed; inset:0; background:rgba(24,37,52,.55);
  display:none; align-items:center; justify-content:center; z-index:100; padding:24px;
}
#overlay.open{display:flex;}
.modal{
  background:var(--paper);
  border-radius:14px;
  width:100%; max-width:560px;
  max-height:86vh;
  overflow-y:auto;
  padding:28px 28px 26px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.modal-head h2{margin:0; font-size:22px;}
.modal-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text-soft); line-height:1;padding:4px;}
.modal-close:hover{color:var(--rust);}

.entry-row{
  display:flex; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; margin-bottom:8px;
}
.entry-row .desc{flex:1; font-size:13.5px;}
.entry-row .desc .who{display:block; font-size:11px; color:var(--text-soft); margin-top:2px;}
.entry-row .valor{font-family:'IBM Plex Mono',monospace; font-size:13.5px; min-width:80px; text-align:right;}
.status-chip{
  border:none; cursor:pointer; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  padding:5px 9px; border-radius:20px;
}
.status-chip.paid{background:var(--sage-light); color:var(--sage);}
.status-chip.pending{background:var(--ochre-light); color:#8A5A22;}

.add-form{
  display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);
}
.add-form .full{grid-column:1/-1;}
.month-totals{display:flex; gap:16px; margin-top:16px; font-size:12.5px; color:var(--text-soft);}
.month-totals b{color:var(--text); font-family:'IBM Plex Mono',monospace;}

.empty-state{
  border:1px dashed var(--line); border-radius:10px; padding:26px; text-align:center;
  color:var(--text-soft); font-size:13.5px; background:rgba(255,255,255,.4);
}

/* ---------- Sub tabs ---------- */
.subtabs{display:flex; gap:6px; margin-bottom:22px; border-bottom:1px solid var(--line);}
.subtab{padding:9px 4px; margin-right:18px; font-size:13.5px; font-weight:600; color:var(--text-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.subtab.active{color:var(--ink); border-color:var(--terracotta);}

/* ---------- Generic table/list ---------- */
.card-list{display:flex; flex-direction:column; gap:10px;}
.item-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;}
.item-card .main{flex:1; min-width:180px;}
.item-card .title{font-family:'Montserrat',sans-serif; font-weight:600; font-size:15.5px;}
.item-card .meta{font-size:12px; color:var(--text-soft); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap;}
.badge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:4px 9px; border-radius:20px;}
.badge.b-plan{background:#E7E9E4; color:#67716A;}
.badge.b-prog{background:var(--ochre-light); color:#8A5A22;}
.badge.b-done{background:var(--sage-light); color:var(--sage);}
.badge.b-adiado{background:var(--rust-light); color:var(--rust);}
.row-actions{display:flex; gap:6px;}

.inline-form{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:20px;}
.inline-form .full{grid-column:1/-1;}
.inline-form-actions{grid-column:1/-1; display:flex; justify-content:flex-end;}

/* ---------- Marca ---------- */
.swatch-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; margin-bottom:18px;}
.swatch{border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--card);}
.swatch .fill{height:64px; position:relative; cursor:pointer;}
.swatch .info{padding:8px 10px; font-size:11.5px;}
.swatch .info .hex{font-family:'IBM Plex Mono',monospace; color:var(--text-soft);}
.swatch .rm{position:absolute; top:4px; right:4px; background:rgba(255,255,255,.75); border:none; border-radius:50%; width:18px; height:18px; font-size:11px; cursor:pointer; line-height:0;}

.chip-input-wrap{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.chip{background:var(--terracotta-light); color:var(--terracotta-deep); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:20px; display:flex; align-items:center; gap:8px;}
.chip button{background:none;border:none;color:var(--terracotta-deep);cursor:pointer;font-size:13px;line-height:0;}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
.panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px;}
.panel h3{margin:0 0 12px; font-size:15px;}
.font-preview{border:1px solid var(--line); border-radius:8px; padding:16px; margin-top:10px; background:var(--paper);}

/* ---------- Etapas / obra ---------- */
.timeline{display:flex; flex-direction:column; gap:0; margin-top:6px;}
.tl-item{display:flex; gap:18px; position:relative; padding-bottom:26px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot-col{display:flex; flex-direction:column; align-items:center; width:16px;}
.tl-dot{width:14px; height:14px; border-radius:50%; border:3px solid var(--line); background:#fff; flex-shrink:0; margin-top:4px;}
.tl-item.done .tl-dot{background:var(--sage); border-color:var(--sage);}
.tl-item.progress .tl-dot{background:var(--ochre); border-color:var(--ochre);}
.tl-line{flex:1; width:2px; background:var(--line); margin-top:4px;}
.tl-item:last-child .tl-line{display:none;}
.tl-body{flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
.tl-body .top-row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
.tl-body input.etapa-name{border:none; background:transparent; font-family:'Montserrat',sans-serif; font-size:15.5px; font-weight:600; padding:2px 0; width:auto; min-width:120px;}
.progress-bar-bg{height:7px; background:#E9ECE7; border-radius:6px; margin:10px 0 8px; overflow:hidden;}
.progress-bar-fill{height:100%; background:var(--sage); border-radius:6px; transition:width .2s;}
.tl-body textarea{width:100%; margin-top:8px; min-height:44px; resize:vertical;}

.overall-bar{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:28px;}

/* ---------- Kanban ---------- */
.kanban{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:start;}
.kcol{background:rgba(255,255,255,.5); border:1px solid var(--line); border-radius:12px; padding:14px;}
.kcol h3{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-soft); margin:2px 0 12px; display:flex; justify-content:space-between;}
.kcard{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:11px 12px; margin-bottom:10px; box-shadow:0 1px 0 var(--line-soft);}
.kcard .ktitle{font-family:'Montserrat',sans-serif; font-size:14.5px; font-weight:500;}
.kcard .kdate{font-size:11px; color:var(--text-soft); margin-top:5px; font-family:'IBM Plex Mono',monospace;}
.kcard .kactions{display:flex; justify-content:space-between; margin-top:9px;}
.kcard .kactions .move{display:flex; gap:4px;}
.kcard .kactions button{background:none; border:1px solid var(--line); border-radius:5px; cursor:pointer; font-size:11px; padding:3px 7px; color:var(--text-soft);}
.kcard .kactions button:hover{border-color:var(--sage); color:var(--sage);}
.kadd{display:flex; gap:6px; margin-bottom:12px;}
.kadd input{flex:1;}

/* ---------- Ideias ---------- */
.idea-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
.idea-card{
  background:var(--card);
  border:1px solid var(--line);
  border-top:4px solid var(--terracotta);
  border-radius:8px;
  padding:16px 16px 14px;
  display:flex; flex-direction:column; gap:8px;
}
.idea-card .title{font-family:'Montserrat',sans-serif; font-size:15px; font-weight:600;}
.idea-card .desc{font-size:12.5px; color:var(--text-soft); line-height:1.5; flex:1;}
.idea-card .bottom{display:flex; justify-content:space-between; align-items:center; margin-top:4px;}

/* ---------- Arquivos e links ---------- */
.link-title{display:flex; align-items:center; gap:8px;}
.link-title a{color:var(--terracotta-deep); text-decoration:none; font-weight:600;}
.link-title a:hover{text-decoration:underline;}

@media (max-width:880px){
  #app{flex-direction:column;}
  #sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; padding:14px;}
  #sidebar .brand,#sidebar .foot,.nav-divider{display:none;}
  .nav-item{white-space:nowrap;}
  #main{padding:26px 18px 60px;}
  .drawer-grid{grid-template-columns:repeat(2,1fr);}
  .dash-grid{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  .kanban{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <div class="brand">
      <svg class="brand-mark" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="34" height="34" rx="10" fill="url(#logoGrad)"/>
        <path d="M22.5 12.2c-1.1-1.3-2.7-2-4.6-2-3 0-4.9 1.5-4.9 3.7 0 2.1 1.7 2.9 4.3 3.5l1.4.3c1.6.4 2.3.8 2.3 1.7 0 1-1 1.6-2.5 1.6-1.7 0-3-.7-3.9-1.9l-2 1.6c1.2 1.8 3.3 2.8 5.8 2.8 3.2 0 5.3-1.6 5.3-4 0-2.1-1.4-3.1-4.1-3.7l-1.4-.3c-1.7-.4-2.5-.8-2.5-1.7 0-.9.9-1.4 2.2-1.4 1.4 0 2.5.6 3.3 1.6l1.8-1.8z" fill="#FBF3EC"/>
        <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="34" y2="34" gradientUnits="userSpaceOnUse">
          <stop stop-color="#C1603C"/><stop offset="1" stop-color="#8B3E24"/>
        </linearGradient></defs>
      </svg>
      <span class="brand-text">Sēntia<small>Sabs &amp; Vic</small></span>
    </div>
    <div class="nav-divider"></div>
    <div class="nav-item" data-section="pagamentos">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
      Pagamentos
    </div>
    <div class="nav-item" data-section="contabilidade">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v5h5"/><path d="M8 13h8M8 17h5"/></svg>
      Contabilidade
    </div>
    <div class="nav-item" data-section="orcamentos">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></svg>
      Orçamentos
    </div>
    <div class="nav-item" data-section="fornecedores">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V8l6-4 6 4v13"/><path d="M15 21V12h6v9"/><path d="M7 12h2M7 16h2M18 16h1"/></svg>
      Fornecedores
    </div>

<div id="overlay"><div class="modal" id="modal-body"></div></div>
<iframe id="print-frame" title="impressao" style="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;"></iframe>

<script>
/* ============ STATE ============ */
const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTHS_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

let state = {
  currentYear: 2026,
  payments: {},        // key "YYYY-M" -> [{id,desc,valor,pago,quem}]
  calendar: [],         // {id,data,canal,tipo,titulo,status}
  acoes: [],            // {id,titulo,objetivo,prazo,responsavel,status}
  marca: { colors: [], sensations: [], voice: '', fontDisplay: '', fontBody: '' },
  etapas: null,         // set to default on first load
  tasks: [],            // {id,titulo,prazo,col} col: 0 fazer,1 fazendo,2 feito
  ideias: [],           // {id,titulo,descricao,status}
  contabilidade: [],    // {id,data,tipo,categoria,valor,nota,notas}
  arquivos: [],         // {id,titulo,url,categoria,notas}
  eventos: [],          // {id,data,titulo,tipo,status,notas}
  fornecedores: [],     // {id,nome,tipo,indicadoPor,valor,contato,link,descritivo}
  orcamentos: []        // {id,item,categoria,fornecedorId,valor,mes,status,notas}
};
const DEFAULT_ETAPAS = [
  'Planejamento e Projeto',
  'Fundação e Estrutura',
  'Instalações elétricas e hidráulicas',
  'Acabamento e Revestimento',
  'Mobiliário e Equipamentos',
  'Inauguração'
].map(n => ({id: uid(), nome: n, status: 'nao_iniciado', progresso: 0, notas: ''}));

function uid(){ return 'id' + Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
function fmtMoney(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

/* ============ SUPABASE ============ */
/* Preencha as duas linhas abaixo com os dados do seu projeto:
   Supabase > Project Settings > API  →  Project URL e a chave publicável (anon).
   Enquanto estiverem vazias, o painel salva só neste navegador.            */
const SUPA_URL = '';   // ex: https://abcdefgh.supabase.co
const SUPA_KEY = '';   // ex: sb_publishable_xxx  (ou a anon key)

const STATE_ROW = 'clinica';
const LOCAL_KEY = 'clinica-state';
const supaOn = () => !!(SUPA_URL && SUPA_KEY);

async function supaFetch(path, method='GET', body=null, extra=null){
  const headers = Object.assign({
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer ' + SUPA_KEY,
    'Content-Type': 'application/json'
  }, extra || {});
  const res = await fetch(SUPA_URL + '/rest/v1/' + path, {
    method, headers, body: body ? JSON.stringify(body) : undefined
  });
  const txt = await res.text();
  if(!res.ok) throw new Error(txt);
  return txt ? JSON.parse(txt) : [];
}
function setSync(msg){
  const el = document.getElementById('sync-foot');
  if(el) el.textContent = msg;
}

let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }catch(e){}
  saveTimer = setTimeout(async ()=>{
    if(!supaOn()){ setSync('Salvo neste navegador. Configure o Supabase para sincronizar.'); return; }
    try{
      await supaFetch('clinica_estado', 'POST',
        [{ id: STATE_ROW, data: state, updated_at: new Date().toISOString() }],
        { 'Prefer': 'resolution=merge-duplicates' });
      setSync('Sincronizado às ' + new Date().toLocaleTimeString('pt-BR').slice(0,5));
    }catch(e){
      setSync('Sem conexão com o Supabase — salvo só neste navegador.');
      console.error('erro ao salvar', e);
    }
  }, 400);
}

async function loadState(){
  let loaded = null;
  if(supaOn()){
    try{
      const rows = await supaFetch('clinica_estado?id=eq.' + STATE_ROW + '&select=data');
      if(rows && rows[0] && rows[0].data) loaded = rows[0].data;
      setSync(loaded ? 'Sincronizado com o Supabase' : 'Conectado ao Supabase — nada salvo ainda');
    }catch(e){ setSync('Não consegui falar com o Supabase — usando a cópia local.'); }
  }else{
    setSync('Salvo neste navegador. Configure o Supabase para sincronizar.');
  }
  if(!loaded){
    try{ const raw = localStorage.getItem(LOCAL_KEY); if(raw) loaded = JSON.parse(raw); }catch(e){}
  }
  if(!loaded && window.storage){
    try{
      const res = await window.storage.get('clinica-state', true);
      if(res && res.value) loaded = JSON.parse(res.value);
    }catch(e){}
  }
  if(loaded) state = Object.assign(state, loaded);
  if(!state.etapas || !state.etapas.length) state.etapas = DEFAULT_ETAPAS;
  if(!state.marca) state.marca = { colors: [], sensations: [], voice:'', fontDisplay:'', fontBody:'' };
  if(!state.ideias) state.ideias = [];
  if(!state.contabilidade) state.contabilidade = [];
  if(!state.arquivos) state.arquivos = [];
  if(!state.eventos) state.eventos = [];
  if(!state.fornecedores) state.fornecedores = [];
  if(!state.orcamentos) state.orcamentos = [];
  if(loaded && supaOn()) saveState(); // grava no Supabase o que veio do navegador
}

/* ============ NAV ============ */
let activeSection = 'pagamentos';
let activeMktTab = 'calendario';

document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click', ()=>{
    activeSection = item.dataset.section;
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    render();
  });
});

function render(){
  const main = document.getElementById('main');
  if(activeSection==='pagamentos') return renderPagamentos(main);
  if(activeSection==='contabilidade') return renderContabilidade(main);
  if(activeSection==='marketing') return renderMarketing(main);
  if(activeSection==='marca') return renderMarca(main);
  if(activeSection==='ideias') return renderIdeias(main);
  if(activeSection==='eventos') return renderEventos(main);
  if(activeSection==='obra') return renderObra(main);
  if(activeSection==='tarefas') return renderTarefas(main);
  if(activeSection==='arquivos') return renderArquivos(main);
  if(activeSection==='fornecedores') return renderFornecedores(main);
  if(activeSection==='orcamentos') return renderOrcamentos(main);
  if(activeSection==='relatorios') return renderRelatorios(main);
}

/* ============ MODAL HELPERS ============ */
const overlay = document.getElementById('overlay');
const modalBody = document.getElementById('modal-body');
function openModal(html){
  modalBody.innerHTML = html;
  overlay.classList.add('open');
}
function closeModal(){ overlay.classList.remove('open'); modalBody.innerHTML=''; }
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

/* ============ PAGAMENTOS ============ */
function monthKey(y,m){ return y+'-'+m; }
function monthEntries(y,m){ return state.payments[monthKey(y,m)] || []; }

function monthStatus(entries){
  if(!entries.length) return 'empty';
  return entries.every(e=>e.pago) ? 'paid' : 'pending';
}

function renderPagamentos(main){
  const y = state.currentYear;
  let yearTotal=0, yearPaid=0, yearPending=0;
  const perPerson = {};
  const monthTotals = [];

  for(let m=0;m<12;m++){
    const entries = monthEntries(y,m);
    let mTotal=0;
    entries.forEach(e=>{
      const v = Number(e.valor)||0;
      mTotal += v; yearTotal += v;
      if(e.pago) yearPaid += v; else yearPending += v;
      const who = e.quem || 'Não informado';
      perPerson[who] = (perPerson[who]||0) + v;
    });
    monthTotals.push(mTotal);
  }
  const maxMonth = Math.max(1, ...monthTotals);

  main.innerHTML = `
    <div class="section-head">
      <div>
        <div class="eyebrow">Financeiro</div>
        <h1>Pagamentos</h1>
        <p>Clique em um mês para cadastrar custos, marcar como pago e ver quem pagou.</p>
      </div>
      <div class="year-switch">
        <button id="y-prev">‹</button>
        <span>${y}</span>
        <button id="y-next">›</button>
      </div>
    </div>

    <div class="dash-grid">
      <div class="dash-card"><div class="label">Total no ano</div><div class="value">${fmtMoney(yearTotal)}</div></div>
      <div class="dash-card paid"><div class="label">Pago</div><div class="value">${fmtMoney(yearPaid)}</div></div>
      <div class="dash-card pending"><div class="label">Pendente</div><div class="value">${fmtMoney(yearPending)}</div></div>
      <div class="dash-card"><div class="label">Meses com lançamento</div><div class="value">${monthTotals.filter(t=>t>0).length}/12</div></div>
    </div>

    <div class="bars">
      ${monthTotals.map((t,i)=>`
        <div class="bar-col">
          <div class="bar" style="height:${Math.max(2,(t/maxMonth)*90)}px"></div>
          <div class="lbl">${MONTHS_SHORT[i]}</div>
        </div>`).join('')}
    </div>

    ${Object.keys(perPerson).length ? `<div class="people-row">
      ${Object.entries(perPerson).map(([who,v])=>`<div class="person-pill">${who} <span class="amt">${fmtMoney(v)}</span></div>`).join('')}
    </div>` : ''}

    <div class="drawer-grid">
      ${MONTHS.map((name,i)=>{
        const entries = monthEntries(y,i);
        const st = monthStatus(entries);
        const total = entries.reduce((s,e)=>s+(Number(e.valor)||0),0);
        const tagText = st==='empty' ? 'Sem lançamentos' : st==='paid' ? 'Tudo pago' : 'Pendente';
        return `<div class="drawer status-${st}" data-m="${i}">
          <div>
            <div class="m-name">${name}</div>
            <div class="m-total">${fmtMoney(total)}</div>
            <div class="m-sub">${entries.length} lançamento${entries.length===1?'':'s'}</div>
          </div>
          <div class="m-tag">${tagText}</div>
        </div>`;
      }).join('')}
    </div>
  `;

  document.getElementById('y-prev').onclick = ()=>{ state.currentYear--; renderPagamentos(main); };
  document.getElementById('y-next').onclick = ()=>{ state.currentYear++; renderPagamentos(main); };
  main.querySelectorAll('.drawer').forEach(d=>{
    d.addEventListener('click', ()=> openMonthModal(y, Number(d.dataset.m)));
  });
}

function openMonthModal(y,m){
  openModal(monthModalHTML(y,m));
  wireMonthModal(y,m);
}
function monthModalHTML(y,m){
  const entries = monthEntries(y,m);
  const total = entries.reduce((s,e)=>s+(Number(e.valor)||0),0);
  const paid = entries.filter(e=>e.pago).reduce((s,e)=>s+(Number(e.valor)||0),0);
  const pending = total - paid;
  return `
    <div class="modal-head">
      <h2>${MONTHS[m]} · ${y}</h2>
      <button class="modal-close" id="m-close">✕</button>
    </div>
    <div id="entries-list">
      ${entries.length ? entries.map(e=>`
        <div class="entry-row" data-id="${e.id}">
          <div class="desc">${e.desc}<span class="who">${e.quem||'—'}</span></div>
          <div class="valor">${fmtMoney(e.valor)}</div>
          <button class="status-chip ${e.pago?'paid':'pending'}" data-toggle="${e.id}">${e.pago?'Pago':'Pendente'}</button>
          <button class="btn danger sm icon" data-del="${e.id}">✕</button>
        </div>
      `).join('') : `<div class="empty-state">Nenhum custo cadastrado ainda para este mês. Adicione o primeiro abaixo.</div>`}
    </div>
    <div class="add-form">
      <div class="full"><label class="field-label">Descrição</label><input id="f-desc" placeholder="Ex: Aluguel, materiais, anúncio..." /></div>
      <div><label class="field-label">Valor (R$)</label><input id="f-valor" type="number" step="0.01" placeholder="0,00" /></div>
      <div><label class="field-label">Quem pagou</label><input id="f-quem" placeholder="Ex: Vic" /></div>
      <div><label class="field-label">Status</label>
        <select id="f-pago"><option value="0">Pendente</option><option value="1">Pago</option></select>
      </div>
      <div class="full" style="display:flex; justify-content:flex-end;"><button class="btn" id="f-add">Adicionar</button></div>
    </div>
    <div class="month-totals">
      <span>Total: <b>${fmtMoney(total)}</b></span>
      <span>Pago: <b>${fmtMoney(paid)}</b></span>
      <span>Pendente: <b>${fmtMoney(pending)}</b></span>
    </div>
  `;
}
function wireMonthModal(y,m){
  document.getElementById('m-close').onclick = ()=>{ closeModal(); renderPagamentos(document.getElementById('main')); };
  modalBody.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.toggle;
      const arr = state.payments[monthKey(y,m)];
      const entry = arr.find(e=>e.id===id);
      entry.pago = !entry.pago;
      saveState();
      openModal(monthModalHTML(y,m)); wireMonthModal(y,m);
    };
  });
  modalBody.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.del;
      state.payments[monthKey(y,m)] = (state.payments[monthKey(y,m)]||[]).filter(e=>e.id!==id);
      saveState();
      openModal(monthModalHTML(y,m)); wireMonthModal(y,m);
    };
  });
  document.getElementById('f-add').onclick = ()=>{
    const desc = document.getElementById('f-desc').value.trim();
    const valor = document.getElementById('f-valor').value;
    const quem = document.getElementById('f-quem').value.trim();
    const pago = document.getElementById('f-pago').value === '1';
    if(!desc || !valor) return;
    const key = monthKey(y,m);
    if(!state.payments[key]) state.payments[key] = [];
    state.payments[key].push({id: uid(), desc, valor: Number(valor), quem, pago});
    saveState();
    openModal(monthModalHTML(y,m)); wireMonthModal(y,m);
  };
}

/* ============ MARKETING ============ */
function renderMarketing(main){
  main.innerHTML = `
    <div class="section-head">
      <div>
        <div class="eyebrow">Marketing</div>
        <h1>Calendário &amp; Ações</h1>
        <p>Organize o que vai ser publicado e as campanhas em andamento.</p>
      </div>
    </div>
    <div class="subtabs">
      <div class="subtab ${activeMktTab==='calendario'?'active':''}" data-tab="calendario">Calendário Editorial</div>
      <div class="subtab ${activeMktTab==='acoes'?'active':''}" data-tab="acoes">Ações</div>
    </div>
    <div id="mkt-content"></div>
  `;
  main.querySelectorAll('.subtab').forEach(t=>{
    t.onclick = ()=>{ activeMktTab = t.dataset.tab; renderMarketing(main); };
  });
  if(activeMktTab==='calendario') renderCalendario(document.getElementById('mkt-content'));
  else renderAcoes(document.getElementById('mkt-content'));
}

function renderCalendario(el){
  const items = [...state.calendar].sort((a,b)=> (a.data||'').localeCompare(b.data||''));
  el.innerHTML = `
    <div class="inline-form">
      <div><label class="field-label">Data</label><input type="date" id="c-data"/></div>
      <div><label class="field-label">Canal</label>
        <select id="c-canal"><option>Instagram</option><option>WhatsApp</option><option>Site</option><option>Email</option><option>Outro</option></select>
      </div>
      <div><label class="field-label">Tipo</label>
        <select id="c-tipo"><option>Post</option><option>Story</option><option>Reels</option><option>Artigo</option><option>Anúncio</option></select>
      </div>
      <div><label class="field-label">Status</label>
        <select id="c-status"><option>Planejado</option><option>Em produção</option><option>Agendado</option><option>Publicado</option></select>
      </div>
      <div class="full"><label class="field-label">Título / tema</label><input id="c-titulo" placeholder="Ex: Antes e depois — tratamento X"/></div>
      <div class="inline-form-actions"><button class="btn" id="c-add">Adicionar ao calendário</button></div>
    </div>
    <div class="card-list" id="cal-list">
      ${items.length ? items.map(it=>`
        <div class="item-card" data-id="${it.id}">
          <div class="main">
            <div class="title">${it.titulo||'(sem título)'}</div>
            <div class="meta">
              <span>${it.data ? new Date(it.data+'T00:00').toLocaleDateString('pt-BR') : 'sem data'}</span>
              <span>${it.canal}</span><span>${it.tipo}</span>
            </div>
          </div>
          <span class="badge ${it.status==='Publicado'?'b-done':it.status==='Planejado'?'b-plan':'b-prog'}">${it.status}</span>
          <div class="row-actions"><button class="btn danger sm" data-del="${it.id}">Excluir</button></div>
        </div>
      `).join('') : `<div class="empty-state">Nenhum conteúdo planejado ainda. Cadastre a primeira publicação acima.</div>`}
    </div>
  `;
  document.getElementById('c-add').onclick = ()=>{
    const data = document.getElementById('c-data').value;
    const canal = document.getElementById('c-canal').value;
    const tipo = document.getElementById('c-tipo').value;
    const status = document.getElementById('c-status').value;
    const titulo = document.getElementById('c-titulo').value.trim();
    if(!titulo) return;
    state.calendar.push({id: uid(), data, canal, tipo, status, titulo});
    saveState(); renderCalendario(el);
  };
  el.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{ state.calendar = state.calendar.filter(x=>x.id!==b.dataset.del); saveState(); renderCalendario(el); };
  });
}

function renderAcoes(el){
  const items = state.acoes;
  el.innerHTML = `
    <div class="inline-form">
      <div class="full"><label class="field-label">Título da ação</label><input id="a-titulo" placeholder="Ex: Campanha de inauguração"/></div>
      <div class="full"><label class="field-label">Objetivo</label><input id="a-objetivo" placeholder="Ex: Gerar 50 leads na região"/></div>
      <div><label class="field-label">Prazo</label><input type="date" id="a-prazo"/></div>
      <div><label class="field-label">Responsável</label><input id="a-resp" placeholder="Ex: Sócia"/></div>
      <div><label class="field-label">Status</label>
        <select id="a-status"><option>A iniciar</option><option>Em andamento</option><option>Concluído</option></select>
      </div>
      <div class="inline-form-actions"><button class="btn" id="a-add">Adicionar ação</button></div>
    </div>
    <div class="card-list">
      ${items.length ? items.map(it=>`
        <div class="item-card" data-id="${it.id}">
          <div class="main">
            <div class="title">${it.titulo}</div>
            <div class="meta">
              <span>${it.objetivo||''}</span>
              ${it.prazo?`<span>prazo ${new Date(it.prazo+'T00:00').toLocaleDateString('pt-BR')}</span>`:''}
              ${it.responsavel?`<span>${it.responsavel}</span>`:''}
            </div>
          </div>
          <span class="badge ${it.status==='Concluído'?'b-done':it.status==='A iniciar'?'b-plan':'b-prog'}">${it.status}</span>
          <div class="row-actions"><button class="btn danger sm" data-del="${it.id}">Excluir</button></div>
        </div>
      `).join('') : `<div class="empty-state">Nenhuma ação cadastrada. Que tal começar com a campanha de inauguração?</div>`}
    </div>
  `;
  document.getElementById('a-add').onclick = ()=>{
    const titulo = document.getElementById('a-titulo').value.trim();
    if(!titulo) return;
    state.acoes.push({
      id: uid(), titulo,
      objetivo: document.getElementById('a-objetivo').value.trim(),
      prazo: document.getElementById('a-prazo').value,
      responsavel: document.getElementById('a-resp').value.trim(),
      status: document.getElementById('a-status').value
    });
    saveState(); renderAcoes(el);
  };
  el.querySelectorAll('[data-del]').forEach(b=>{

  });

    inp.addEventListener('change', ()=>{ etapas.find(e=>e.id===inp.dataset.name).nome = inp.value; saveState(); });
  });

/* ============ RELATÓRIOS DO MÊS ============ */
let repY = new Date().getFullYear();
let repM = new Date().getMonth();

function reportData(y, m){
  const mesISO = y + '-' + String(m+1).padStart(2,'0');
  const pays = (state.payments[monthKey(y,m)] || []);
  const totalPay = pays.reduce((s,p)=> s + (Number(p.valor)||0), 0);
  const totalPago = pays.filter(p=>p.pago).reduce((s,p)=> s + (Number(p.valor)||0), 0);
  const porQuem = {};
  pays.filter(p=>p.pago).forEach(p=>{ const q = p.quem || 'não informado'; porQuem[q] = (porQuem[q]||0) + (Number(p.valor)||0); });

  const cont = (state.contabilidade||[]).filter(i=> (i.data||'').startsWith(mesISO));
  const receita = cont.filter(i=>i.tipo==='Receita').reduce((s,i)=> s + (Number(i.valor)||0), 0);
  const despesa = cont.filter(i=>i.tipo==='Despesa').reduce((s,i)=> s + (Number(i.valor)||0), 0);

  const orcs = (state.orcamentos||[]).filter(o=> (o.mes||'') === mesISO);
  const orcTotal = orcs.reduce((s,o)=> s + (Number(o.valor)||0), 0);
  const orcPago = orcs.filter(o=>o.status==='Pago').reduce((s,o)=> s + (Number(o.valor)||0), 0);

  const posts = (state.calendar||[]).filter(c=> (c.data||'').startsWith(mesISO));
  const evs = (state.eventos||[]).filter(e=> (e.data||'').startsWith(mesISO));
  const etapas = state.etapas || [];
  const progresso = etapas.length ? Math.round(etapas.reduce((s,e)=> s + (Number(e.progresso)||0), 0) / etapas.length) : 0;

  return { mesISO, pays, totalPay, totalPago, totalPend: totalPay - totalPago, porQuem,
           cont, receita, despesa, resultado: receita - despesa,
           orcs, orcTotal, orcPago, orcAberto: orcTotal - orcPago,
           posts, evs, progresso };
}

      <div class="kpi"><b>${money(d.resultado)}</b><span>Resultado</span></div>
      <div class="kpi"><b>${d.progresso}%</b><span>Obra</span></div>
    </div>
    ${quem ? '<h2>Quem pagou</h2><div class="cards">' + quem + '</div>' : ''}

    <h2>Pagamentos</h2>
    <table><thead><tr><th>Descrição</th><th>Quem pagou</th><th class="r">Valor</th><th>Situação</th></tr></thead><tbody>${linhaPag}</tbody></table>

    <h2>Previsão de orçamentos</h2>
    <table><thead><tr><th>Item</th><th>Categoria</th><th>Fornecedor</th><th class="r">Valor</th><th>Situação</th></tr></thead><tbody>${linhaOrc}</tbody></table>

    <h2>Contabilidade</h2>
    <table><thead><tr><th>Data</th><th>Categoria</th><th>Tipo</th><th class="r">Valor</th><th>Nota</th></tr></thead><tbody>${linhaCont}</tbody></table>

    <h2>Marketing e acontecimentos</h2>
    <table><thead><tr><th>Data</th><th>Título</th><th>Canal / tipo</th><th>Situação</th></tr></thead><tbody>${linhaMkt}</tbody></table>

    <div class="foot">Gerado em ${new Date().toLocaleDateString('pt-BR')}</div>
  </body></html>`;

  const f = document.getElementById('print-frame');
  const doc = f.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){} }, 350);
}

/* ============ INIT ============ */
(async function init(){
  await loadState();
  document.querySelector('.nav-item[data-section="pagamentos"]').classList.add('active');
  render();
})();
</script>
</body>
